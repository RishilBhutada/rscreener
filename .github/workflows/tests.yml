name: Tests

# The checks that stop the 4-Nov-2026 fixes from coming back: the pipeline's
# core calculations (tests/), the web TTM rule, and the web type check.
# Read-only: nothing here deploys, publishes, or touches the data-db release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pandas numpy requests
      - run: python -m pytest tests -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm test
      - run: npx tsc --noEmit
