name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # NOT the same group as the nightly refresh. They shared "pages", and this one
  # cancels in progress - so every push killed a running nightly. Five runs in a
  # row were cancelled that way on 3-Aug-2026 and the data stopped refreshing
  # entirely, silently, while each individual push looked fine.
  # Superseding an older DEPLOY is still right, hence cancel-in-progress here.
  # The two jobs can safely overlap: both publish through the github-pages
  # environment, which serialises deployments on its own.
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Not secrets - a Firebase web config identifies the project and nothing more;
    # the Firestore rules are what protect the data. Held as repository secrets
    # only to keep the values in one place. Absent, the app builds with sign-in
    # dormant and behaves exactly as it did before.
    env:
      NEXT_PUBLIC_BASE_PATH: /rscreener
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refuse to deploy stale prices or shallower charts
        # The committed data files are what this job publishes, so a hand-run
        # export from a local database lands here without ever touching the
        # nightly job. That path is how a three-week-old price snapshot and a
        # truncated ratio history both reached production. Same gates, both roads.
        run: |
          python pipeline/check_prices.py
          python pipeline/check_depth.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
