name: Publish after a code change

on:
  push:
    branches: [main]
    # Data files are published by the nightly, not from here. Without this a
    # nightly's own state commit would trigger a deploy of the data it just
    # replaced.
    paths-ignore:
      - "web/public/**"
      - "pipeline/scorecard_history.json"
      - "pipeline/depth_baseline.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: publish-after-push
  cancel-in-progress: true

jobs:
  # This job used to BUILD AND PUBLISH THE SITE from the data committed in the
  # repository. That data is not what the nightly publishes - the nightly
  # exports fresh files and uploads them as a Pages artifact without ever
  # committing them - so the two paths shipped different data and whichever ran
  # last won. A code push therefore republished whatever data happened to be
  # committed, silently reverting the site to an older dataset, and the price
  # guard here ran against those same stale files and failed on every push.
  #
  # There is now ONE publisher. A code push asks the nightly to rebuild and
  # republish with no fetching, which restores the current database, re-exports
  # from it, runs the same guards and deploys - about ten minutes, with the code
  # from this push and the data from the database.
  request-republish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # Build here purely to CHECK the push compiles. Nothing from it is
      # published; a broken build must fail loudly before anything is asked to
      # republish.
      - run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /rscreener
      - name: Ask the nightly to rebuild and publish with the current data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run nightly.yml -f scope="rebuild and publish only (no fetching)"             || { echo "could not start the publish run - start it from the Data page"; exit 1; }
          echo "requested a rebuild-and-publish run; the site updates when it finishes"
