name: Nightly data refresh

on:
  schedule:
    # 22:00 IST daily - after NSE close and Yahoo's EOD settlement
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests yfinance
      - name: Download the data DB from the data-db release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          if gh release download data-db --pattern rscreener.db.gz --dir data; then
            gunzip -f data/rscreener.db.gz
            echo "DB restored from release"
          else
            echo "no data-db release yet - starting from empty DB (historical depth will be missing)"
          fi
      - run: python pipeline/fetch_universe.py
      - name: Refresh snapshot fundamentals (prices, ratios) for the full universe
        run: python pipeline/fetch_fundamentals.py --all --snapshot-only --max-age-hours 20 --sleep 0.5
      - name: Refresh upcoming events calendar
        run: python pipeline/fetch_events.py
      - name: Refresh shareholding patterns (weekly rotation)
        run: python pipeline/fetch_shareholding.py --symbols @data/top500.txt --max-age-hours 156 --sleep 0.4
      - name: Refresh price-chart history (weekly rotation)
        run: python pipeline/fetch_prices.py --symbols @data/top500.txt --max-age-hours 156 --sleep 0.5
      - name: Refresh concall/rating documents (weekly rotation)
        run: python pipeline/fetch_announcement_docs.py --symbols @data/top500.txt --max-age-hours 156 --sleep 0.5
      - name: Write the full-universe symbol list for the earnings refresh
        run: |
          python -c "import sqlite3;from pathlib import Path;c=sqlite3.connect('data/rscreener.db',timeout=180);s=[r[0] for r in c.execute('SELECT symbol FROM universe ORDER BY symbol')];Path('data/all_symbols.txt').write_text(','.join(s));print(len(s),'symbols')"
      - name: Keep as-filed earnings CURRENT across the whole universe
        # This was `--symbols @data/top500.txt --limit 25`: 25 names a night out of
        # 500. At that rate the other 1,800 symbols were never revisited at all -
        # 1,430 of them sat on earnings that stopped at Dec-2024, so their P/E
        # lines died 19 months back while the price line kept moving. MTAR Tech's
        # chart topped out at 153 where screener showed 496. Recent quarters,
        # whole universe, every night; depth stays a bounded rotation below.
        # --limit 800 keeps one night inside the Actions job timeout. Three nights
        # clear the backlog; after that --max-age-hours 168 means each symbol comes
        # up weekly, so steady state is ~340 a night and the cap never binds.
        run: python pipeline/fetch_results_history.py --symbols @data/all_symbols.txt --max-age-hours 168 --limit 800 --quarters-back 8 --sleep 0.25
        continue-on-error: true
      - name: Record when each set of results was ANNOUNCED
        # Drives the quarter-coloured EPS bars and result markers on the charts,
        # and - more importantly - lets the ratio bands step earnings in on the day
        # the market could read them rather than the day the quarter ended. TCS
        # publishes 9-12 days after quarter end, MTAR Technologies 29-42, and MTAR
        # published nothing at all between 29-Jan and 29-Jul 2026. One index call
        # per symbol, so this is cheap next to a results re-fetch.
        run: python pipeline/fetch_filing_dates.py --symbols @data/all_symbols.txt --max-age-hours 168 --limit 900 --sleep 0.2
        continue-on-error: true
      - name: Deepen as-filed P&L history (bounded rotation, full ~20yr depth)
        run: python pipeline/fetch_results_history.py --symbols @data/all_symbols.txt --max-age-hours 4320 --limit 60 --quarters-back 0 --sleep 0.3
        continue-on-error: true
      - name: Refresh IPOs (official NSE issues + live subscription)
        run: python pipeline/fetch_ipos.py
      - name: Snapshot grey-market premium (unofficial; builds the accuracy record)
        run: python pipeline/fetch_gmp.py
      - run: python pipeline/export_json.py
      - run: python pipeline/export_company_json.py
      - run: python pipeline/export_ipos.py
      - name: Publish the data-freshness report the app shows on /status
        run: python pipeline/export_status.py
      - name: Refuse to publish if chart history went backwards
        # Guards the failure that shipped for weeks: a stale restored DB exports
        # ~7 years of ratio history in place of ~20, and deploys it silently.
        # Failing here also stops the stale DB being re-uploaded below, so the
        # loop cannot feed itself.
        run: python pipeline/check_depth.py
      - name: Refuse to publish stale or inconsistent prices
        # Same class of failure, on the number everything else is derived from:
        # a snapshot that stopped refreshing kept HDFC Bank at Rs 824.95 for three
        # weeks against a real Rs 750. A wrong price looks exactly like a right
        # one on screen, so it has to be caught here rather than by eye.
        run: python pipeline/check_prices.py
      - name: Upload the updated DB back to the data-db release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gzip -c data/rscreener.db > rscreener.db.gz
          gh release upload data-db rscreener.db.gz --clobber || \
          gh release create data-db rscreener.db.gz --title "Data DB" --notes "SQLite data snapshot used and refreshed by the nightly workflow."
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /rscreener
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
