name: Nightly data refresh

on:
  schedule:
    # 22:00 IST daily - after NSE close and Yahoo's EOD settlement
    - cron: "30 16 * * *"
  workflow_dispatch:
    # A scheduled run does everything. A hand-started one can be aimed: chasing a
    # single company's missing history should not mean waiting out a full crawl,
    # and re-publishing after a code change should not re-fetch anything at all.
    inputs:
      scope:
        description: "What to refresh"
        type: choice
        default: everything
        options:
          - everything
          - prices and snapshot only
          - earnings and results only
          - corporate actions only
          - rebuild and publish only (no fetching)
      symbols:
        description: "Limit to these symbols, comma separated (blank = whole universe)"
        type: string
        default: ""
      deep:
        description: "Fetch FULL history depth for the symbols above, not just recent quarters"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Its own group, so a push cannot cancel a refresh that is already hours in.
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Below GitHub's 6-hour hard kill, and ABOVE the fetch deadline plus the
    # time publishing needs. Fetching stops itself at 260 minutes; saving,
    # exporting, checking and building take about 40 more. This is now a
    # backstop for something going wrong, not the thing that ends the run.
    #
    # It used to be 330 with fetching that took 330, so the cap WAS the end of
    # the run: every night the job was cancelled at step 16 of 31 and the save,
    # the export and the publish never happened at all.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests yfinance
      - name: Download the data DB from the data-db release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          if gh release download data-db --pattern rscreener.db.gz --dir data; then
            gunzip -f data/rscreener.db.gz
            echo "DB restored from release"
          else
            echo "no data-db release yet - starting from empty DB (historical depth will be missing)"
          fi
      - name: Work out what this run should do
        id: plan
        run: |
          SCOPE="${{ inputs.scope }}"; [ -z "$SCOPE" ] && SCOPE="everything"
          SYMS="${{ inputs.symbols }}"
          echo "scope=$SCOPE"                                   >> "$GITHUB_OUTPUT"
          case "$SCOPE" in
            everything)                    P=1; E=1; C=1 ;;
            "prices and snapshot only")    P=1; E=0; C=0 ;;
            "earnings and results only")   P=0; E=1; C=0 ;;
            "corporate actions only")      P=0; E=0; C=1 ;;
            *)                             P=0; E=0; C=0 ;;
          esac
          echo "prices=$P"   >> "$GITHUB_OUTPUT"
          echo "earnings=$E" >> "$GITHUB_OUTPUT"
          echo "actions=$C"  >> "$GITHUB_OUTPUT"
          if [ -n "$SYMS" ]; then
            echo "target=$SYMS"     >> "$GITHUB_OUTPUT"
            echo "nse_target=$SYMS" >> "$GITHUB_OUTPUT"
            echo "targeted=1"       >> "$GITHUB_OUTPUT"
          else
            # Yahoo answers for both exchanges; the NSE filing endpoints do not.
            echo "target=@data/all_symbols.txt"     >> "$GITHUB_OUTPUT"
            echo "nse_target=@data/nse_symbols.txt" >> "$GITHUB_OUTPUT"
            echo "targeted=0"                       >> "$GITHUB_OUTPUT"
          fi
          echo "qb=${{ inputs.deep == true && '0' || '8' }}" >> "$GITHUB_OUTPUT"
          # ONE deadline for all fetching, leaving the rest of the job to save,
          # export, check and publish. Fetching used to run until the job's own
          # backstop killed it, which meant it never reached any of those - five
          # and a half hours of work discarded nightly for two weeks. Whatever is
          # fetched by this moment is what gets published; the rest comes up
          # tomorrow. Partial data published beats complete data thrown away.
          echo "RSCREENER_DEADLINE=$(( $(date -u +%s) + 260*60 ))" >> "$GITHUB_ENV"
          echo "Run plan: scope=$SCOPE symbols=${SYMS:-all}"
          echo "Fetching stops at $(date -u -d '+260 minutes' '+%H:%M UTC'), leaving 90 minutes to publish."
      - run: python pipeline/fetch_universe.py
      - name: Write the symbol lists every fetcher works from
        # TWO lists, because the sources do not cover the same companies.
        # Yahoo answers for both exchanges once the universe carries the right
        # ticker suffix, so prices and the snapshot run over everything. The NSE
        # filing endpoints know nothing about a BSE-only company - asking would
        # spend 2,700 requests to be told so, every night, and write 2,700 error
        # rows that look exactly like a coverage gap.
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          c = sqlite3.connect('data/rscreener.db', timeout=180)
          cols = {r[1] for r in c.execute('PRAGMA table_info(universe)')}
          allsym = [r[0] for r in c.execute('SELECT SYMBOL FROM universe ORDER BY SYMBOL')]
          if 'EXCHANGE' in cols:
              nse = [r[0] for r in c.execute(
                  "SELECT SYMBOL FROM universe WHERE EXCHANGE='NSE' OR EXCHANGE IS NULL ORDER BY SYMBOL")]
          else:
              nse = allsym
          Path('data/all_symbols.txt').write_text(','.join(allsym))
          Path('data/nse_symbols.txt').write_text(','.join(nse))
          print(f"{len(allsym)} companies, {len(nse)} of them on NSE")
          PY
      - name: Refresh snapshot fundamentals (prices, ratios) for the full universe
        if: steps.plan.outputs.prices == '1'
        run: python pipeline/fetch_fundamentals.py --all --snapshot-only --max-age-hours 20 --sleep 0.5
      - name: Refresh annual and quarterly statements (rotating)
        if: steps.plan.outputs.prices == '1'
        # ROCE, the margins, book value and both growth figures are computed
        # from these. The nightly only ever ran --snapshot-only, so they were
        # never refreshed and a company added later received none at all: every
        # one of the 2,700 BSE companies had zero statement rows, which is why
        # ROCE, promoter holding and the growth figures read exactly 0.0% across
        # half the universe.
        #
        # Its own log, deliberately. Gated on the snapshot's log - stamped for
        # every symbol nightly - this pass would be told "nobody is due" forever,
        # the same fault that stopped the deep backfill running even once.
        # Monthly per company, 500 a night, inside the run's shared deadline.
        run: bash pipeline/guarded_fetch.sh python pipeline/fetch_fundamentals.py --symbols ${{ steps.plan.outputs.target }} --statements --max-age-hours 720 --limit 500 --sleep 0.4
      - name: Refresh upcoming events calendar
        if: steps.plan.outputs.prices == '1'
        run: python pipeline/fetch_events.py
      - name: Refresh shareholding patterns (whole universe, rotating)
        if: steps.plan.outputs.earnings == '1'
        # Was @data/top500.txt, so the other 1,857 companies were unreachable: 432
        # had never been fetched at all and never would be. A rotation that cannot
        # reach part of its own universe is not a rotation, it is a permanent hole.
        run: bash pipeline/guarded_fetch.sh python pipeline/fetch_shareholding.py --symbols @data/nse_symbols.txt --max-age-hours 336 --limit 700 --sleep 0.3
      - name: Refresh price-chart history (whole universe, rotating)
        if: steps.plan.outputs.prices == '1'
        # The WHOLE universe, every night - deliberately not a rotation.
        #
        # It used to be --max-age-hours 168 --limit 600, so each symbol's chart
        # was revisited about weekly. That is defensible for a shareholding
        # pattern filed once a quarter. It is not defensible for a price, which
        # every ratio on the site divides by: with 2,357 companies and 600 a
        # night, three quarters of the site would always be showing a close from
        # earlier in the week, and check_prices - which fails the build when more
        # than 2% of companies lag the newest close - could never once pass.
        # A rotation that guarantees the guard fails is not a rotation, it is a
        # standing outage.
        #
        # --max-age-hours 20 means "anything not already fetched today", so a
        # re-run the same night costs nothing. About 20 minutes for the full
        # universe at this sleep, against a 6-hour job limit.
        run: bash pipeline/guarded_fetch.sh python pipeline/fetch_prices.py --symbols ${{ steps.plan.outputs.target }} --max-age-hours 20 --sleep 0.25
      - name: Refresh concall/rating documents (whole universe, rotating)
        if: steps.plan.outputs.earnings == '1'
        # 480 of 2,357 companies covered, and capped at the top 500 it would have
        # stayed that way permanently.
        run: bash pipeline/guarded_fetch.sh python pipeline/fetch_announcement_docs.py --symbols @data/nse_symbols.txt --max-age-hours 336 --limit 500 --sleep 0.35
      - name: Refresh annual-report links (rotating)
        if: steps.plan.outputs.earnings == '1'
        # Never ran on any schedule. 19,087 links were fetched once for 1,824
        # companies and frozen there: 36% coverage, no new company ever getting
        # reports and no company ever getting its newest one. Monthly per
        # company, inside the run's shared deadline.
        run: bash pipeline/guarded_fetch.sh python pipeline/fetch_documents.py --symbols ${{ steps.plan.outputs.nse_target }} --max-age-hours 720 --limit 400 --sleep 0.35
      - name: Keep as-filed earnings CURRENT across the whole universe
        if: steps.plan.outputs.earnings == '1'
        # This was `--symbols @data/top500.txt --limit 25`: 25 names a night out of
        # 500. At that rate the other 1,800 symbols were never revisited at all -
        # 1,430 of them sat on earnings that stopped at Dec-2024, so their P/E
        # lines died 19 months back while the price line kept moving. MTAR Tech's
        # chart topped out at 153 where screener showed 496. Recent quarters,
        # whole universe, every night; depth stays a bounded rotation below.
        # --limit 800 keeps one night inside the Actions job timeout. Three nights
        # clear the backlog; after that --max-age-hours 168 means each symbol comes
        # up weekly, so steady state is ~340 a night and the cap never binds.
        run: bash pipeline/guarded_fetch.sh python pipeline/fetch_results_history.py --symbols ${{ steps.plan.outputs.nse_target }} --max-age-hours 168 --limit 800 --quarters-back ${{ steps.plan.outputs.qb }} --sleep 0.25
      - name: Refresh corporate actions (dividends, bonuses, splits, rights)
        if: steps.plan.outputs.actions == '1'
        # One index call per symbol against the same NSE host as the filing dates,
        # so it rides the same rate budget. Corrects an existing error too: the
        # Yahoo splits table files Reliance's Oct-2024 one-for-one BONUS as a
        # "2:1 split", and NSE labels it correctly.
        run: bash pipeline/guarded_fetch.sh python pipeline/fetch_corporate_actions.py --symbols ${{ steps.plan.outputs.nse_target }} --max-age-hours 336 --limit 800 --sleep 0.2
      - name: Record when each set of results was ANNOUNCED
        if: steps.plan.outputs.earnings == '1'
        # Drives the quarter-coloured EPS bars and result markers on the charts,
        # and - more importantly - lets the ratio bands step earnings in on the day
        # the market could read them rather than the day the quarter ended. TCS
        # publishes 9-12 days after quarter end, MTAR Technologies 29-42, and MTAR
        # published nothing at all between 29-Jan and 29-Jul 2026. One index call
        # per symbol, so this is cheap next to a results re-fetch.
        run: bash pipeline/guarded_fetch.sh python pipeline/fetch_filing_dates.py --symbols ${{ steps.plan.outputs.nse_target }} --max-age-hours 168 --limit 900 --sleep 0.2
      - name: Deepen as-filed P&L history (bounded rotation, full ~20yr depth)
        if: steps.plan.outputs.earnings == '1'
        # 60 a night meant 2,000 companies would take 33 nights to gain full depth,
        # which is why 1,994 of them hold 20 quarters or fewer and CEMPRO's ratio
        # charts start in 2023 while its price starts in 2002. 200 costs roughly
        # 50 minutes and clears the backlog in ten nights instead.
        run: bash pipeline/guarded_fetch.sh python pipeline/fetch_results_history.py --symbols @data/nse_symbols.txt --max-age-hours 4320 --limit 200 --quarters-back 0 --sleep 0.3 --max-minutes 75
      - name: Refresh IPOs (official NSE issues + live subscription)
        if: steps.plan.outputs.prices == '1'
        run: python pipeline/fetch_ipos.py
      - name: Snapshot grey-market premium (unofficial; builds the accuracy record)
        if: steps.plan.outputs.prices == '1'
        run: python pipeline/fetch_gmp.py
      - name: Save the fetched data back to the data-db release
        # Placed BEFORE the publish guards, deliberately. It used to sit after
        # them, which deadlocked: a guard failure skipped the upload, so the next
        # night restored the SAME stale database and failed in exactly the same
        # way, forever. Run #24 tripped the depth guard on 1-Aug-2026 and the
        # stored database stayed frozen at 31-Jul until it was replaced by hand.
        #
        # This comment used to claim "fetching only ever ADDS rows, so a
        # database that has just been fetched into is never worse than the one
        # restored". That was wrong, and saving unconditionally on the strength
        # of it is how a bad night became permanent. The snapshot fetcher
        # DELETEs a symbol's row before writing the new one, so a half-answered
        # Yahoo response replaced RELIANCE's and TCS's market cap with nothing
        # on 4-Aug-2026, and this step then wrote that loss into the release.
        #
        # What actually makes saving safe is the coalesce in
        # fetch_fundamentals.keep_known_values: a field the source left blank
        # can no longer overwrite a field we already knew. Rows can still be
        # added and values still corrected - both wanted - but a fetch can no
        # longer subtract knowledge, which is the property this step relies on.
        #
        # The guards exist to stop a bad EXPORT reaching the site. They should
        # not also be able to throw away a night of successful fetching.
        #
        # always() so a failed fetch step still preserves whatever did arrive.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE=$(stat -c%s data/rscreener.db 2>/dev/null || echo 0)
          # Never overwrite a good release with an empty or half-restored file:
          # that would destroy the only copy. 100 MB is far below a real database
          # and far above anything a failed restore leaves behind.
          if [ "$SIZE" -lt 100000000 ]; then
            echo "database is only $SIZE bytes - refusing to overwrite the stored copy"; exit 0
          fi
          gzip -c data/rscreener.db > rscreener.db.gz
          gh release upload data-db rscreener.db.gz --clobber || \
          gh release create data-db rscreener.db.gz --title "Data DB" --notes "SQLite data snapshot used and refreshed by the nightly workflow."
          echo "stored $(du -h rscreener.db.gz | cut -f1)"

      - run: python pipeline/export_json.py
      - run: python pipeline/export_company_json.py
      - run: python pipeline/export_ipos.py
      - name: Score the data and record the score
        # Runs every night, after the export and before the guards, so the score
        # describes what is about to be published. Appending to a history file
        # is the point: a change either moves this number or it did not do what
        # it claimed. Never allowed to stop a publish - a broken scoreboard is
        # not a reason to withhold good data.
        continue-on-error: true
        run: python pipeline/scorecard.py
      - name: Publish the data-freshness report the app shows on /status
        run: python pipeline/export_status.py
      - name: Refuse to publish if chart history went backwards
        # Guards the failure that shipped for weeks: a stale restored DB exports
        # ~7 years of ratio history in place of ~20, and deploys it silently.
        # Failing here also stops the stale DB being re-uploaded below, so the
        # loop cannot feed itself.
        run: python pipeline/check_depth.py
      - name: Refuse to publish a figure that is not the company's own filing
        # Dixon Technologies showed Rs 171cr profit for Dec-2024 where the filing
        # says Rs 216cr - Yahoo's owners-only net income published in place of the
        # filed total. Neither number looks wrong on screen, which is why it needs
        # checking here: 1,323 quarterly and 445 annual profit figures across the
        # universe sit more than 5% apart between the two sources.
        run: python pipeline/check_sources.py
      - name: Refuse to publish stale or inconsistent prices
        # Same class of failure, on the number everything else is derived from:
        # a snapshot that stopped refreshing kept HDFC Bank at Rs 824.95 for three
        # weeks against a real Rs 750. A wrong price looks exactly like a right
        # one on screen, so it has to be caught here rather than by eye.
        run: python pipeline/check_prices.py
      - name: Build the site from the LATEST code, not the checkout from hours ago
        # This job checks out main and then spends two to four hours fetching. The
        # code it builds at the end is therefore whatever main was when it STARTED,
        # and it publishes the whole site - so a run that began before a fix
        # quietly republishes the version without it. Run #52 did exactly that on
        # 8-Aug-2026: it started at 7bc480ec, finished after the BSE work landed,
        # and put the site back to 2,374 companies and the old page title. Nothing
        # failed; the deploy was a success, of stale code.
        #
        # Data comes from THIS run and is already in the working tree. Only the
        # source is moved forward, and only tracked files are touched, so the
        # exported JSON the guards just approved is left exactly as it is.
        run: |
          git fetch origin main --depth=1
          BEFORE=$(git rev-parse --short HEAD)
          git checkout FETCH_HEAD -- web/src web/package.json web/package-lock.json web/next.config.ts 2>/dev/null || true
          echo "built from $(git rev-parse --short FETCH_HEAD) (this job started at $BEFORE)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # Not secrets - a Firebase web config identifies the project and nothing more;
      # the Firestore rules are what protect the data. Held as repository secrets
      # only to keep the values in one place. Absent, the app builds with sign-in
      # dormant and behaves exactly as it did before.
        env:
          NEXT_PUBLIC_BASE_PATH: /rscreener
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Two attempts, because the first one can fail for reasons that have
      # nothing to do with this repository. Run #50 passed every guard, exported
      # cleanly, and then lost the deployment to "Failed to get ID Token:
      # Request timeout" - GitHub's own OIDC service not answering. The data was
      # good, the run was marked failed, and the notification said the nightly
      # had broken.
      #
      # A first attempt that is allowed to fail, then one retry after a pause.
      # A genuine problem - wrong permissions, a bad artifact - fails both and
      # still reports; a service that was briefly busy does not wake anyone.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait, then try the deployment once more
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # A failed refresh is SILENT otherwise: the site keeps serving yesterday's data
  # and looks completely normal. That is what happened on 1-Aug-2026 - the depth
  # guard correctly refused to publish, nothing shipped, and nothing said so.
  # `if: failure()` covers both jobs, so a broken fetch, a tripped guard and a
  # failed deploy all reach the phone.
  notify:
    needs: [refresh, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Push a failure notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC secret is not set - nothing to notify"; exit 0
          fi
          curl -s --max-time 20             -H "Title: Rscreener nightly refresh failed"             -H "Priority: high"             -H "Tags: warning"             -d "${{ needs.refresh.result == 'failure' && 'The data did not update tonight. The site is still showing the last good data, not wrong data - the guards stop a bad release rather than publishing it.' || 'The data was fetched and passed every guard, but publishing it failed. The site is still on the previous release; re-running the workflow should be enough.' }} Open the run to see which step stopped: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"             "https://ntfy.sh/$NTFY_TOPIC" || echo "notification failed to send"
